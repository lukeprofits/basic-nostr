# Publish to PyPI via Trusted Publishing (OIDC — no API token needed).
# Runs when a GitHub release is published, or manually from the Actions tab.
#
# One-time setup on pypi.org (project: basic-nostr → Manage → Publishing):
#   add a "trusted publisher" with owner=lukeprofits, repo=basic-nostr,
#   workflow=publish.yml, environment=pypi

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
